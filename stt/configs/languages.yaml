# STT language profiles — English + Hindi on whisper-base (multilingual)
#
# POLICY: Jetson STT = CUDA ONLY. No CPU fallback.
# Fine-tune goal: transcribe real speech (en/hi); ignore non-speech
# vocalizations (scream / laugh / moan / cry) → empty transcript.

default_profile: en_hi_base_v1

profiles:
  # Single multilingual checkpoint covering en + hi after fine-tune
  en_hi_base_v1:
    lang_code: multilingual
    languages: [en, hi]
    multilingual: true
    upstream: openai/whisper-base
    artifact: models/export/en-hi-base-v1-fp16
    finetuned: models/finetuned/en-hi-base-v1
    runtime: whisper_pytorch
    device: cuda
    require_cuda: true
    allow_cpu_fallback: false
    sample_rate: 16000
    decode:
      beam_size: 1
      # null = auto-detect between en/hi after multilingual fine-tune
      language: null
      task: transcribe

  en_only:
    lang_code: en
    languages: [en]
    multilingual: true
    upstream: openai/whisper-base
    artifact: models/export/en-hi-base-v1-fp16
    runtime: whisper_pytorch
    device: cuda
    require_cuda: true
    allow_cpu_fallback: false
    sample_rate: 16000
    decode:
      beam_size: 1
      language: en
      task: transcribe

  hi_only:
    lang_code: hi
    languages: [hi]
    multilingual: true
    upstream: openai/whisper-base
    artifact: models/export/en-hi-base-v1-fp16
    runtime: whisper_pytorch
    device: cuda
    require_cuda: true
    allow_cpu_fallback: false
    sample_rate: 16000
    decode:
      beam_size: 1
      language: hi
      task: transcribe
