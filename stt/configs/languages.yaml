# STT language profiles — switch / train by editing this file.
# See stt/README.md

default_profile: en_domain_v1

profiles:
  en_domain_v1:
    lang_code: en
    multilingual: false
    upstream: openai/whisper-tiny.en
    artifact: models/export/en-domain-v1-fp16
    runtime: whisper_pytorch  # whisper_pytorch | whisper_ct2
    device: cuda
    sample_rate: 16000
    decode:
      beam_size: 1
      language: en
      task: transcribe

  en_base_v1:
    lang_code: en
    multilingual: false
    upstream: openai/whisper-base.en
    artifact: models/export/en-base-v1-fp16
    runtime: whisper_pytorch
    device: cuda
    sample_rate: 16000
    decode:
      beam_size: 1
      language: en
      task: transcribe
