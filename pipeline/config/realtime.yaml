# Real-time VAD speech-to-speech pipeline config (PC).
# See docs/05-vad-realtime-integration.md §8.
# Paths are relative to the repo root.

# Which text stage runs between STT and TTS: translate | reason.
# See docs/reasoningModel/01-gemma-reasoning-mode.md. Override with --mode.
mode: translate

capture:
  # null = system default input device (not always your USB mic!). Run
  # `venv/bin/python pipeline/run_realtime.py --list-devices` to see indices,
  # then set this to an index (e.g. 3) or a name substring (e.g. "USB").
  device: null
  sample_rate: 16000
  frame_ms: 20
  # Drop endpointed chunks quieter than this (int16 peak). Cuts USB-mic
  # hiss before Whisper can hallucinate "you"/"Bye". Raise if real speech
  # is being dropped; lower if quiet speech is missed.
  min_peak_abs: 2500
  vad:
    backend: webrtc        # webrtc | energy
    aggressiveness: 3      # 0–3; 3 = strictest (less noise → speech)
    silence_ms: 700
    min_utterance_ms: 700
    max_utterance_ms: 10000
    pre_roll_ms: 200
    # reason.barge_in only (doc §19): consecutive speech before barge-in.
    speech_start_debounce_ms: 300

queues:
  audio_queue: { maxsize: 8 }        # Q0 — drop-oldest on full (in capture.py)
  transcript_queue: { maxsize: 32 }  # Q1 — blocks STT worker on full
  translation_queue: { maxsize: 32 } # Q2 — blocks MT worker on full
  wav_queue: { maxsize: 8 }          # Q3 — blocks TTS worker on full

stt:
  model_dir: stt/models/export/en-hi-base-v1-fp16
  language: en
  beam_size: 1
  # Drop Whisper filler/hallucinations ("you", "mm", "Bye", …) before Gemma.
  drop_noise_transcripts: true

translate:                             # unchanged by reason mode — still the default path
  pair: en-hi
  tgt_lang: hi
  model_dir: translate/models/export/en-hi-v1-fp16
  fallback_model_dir: translate/models/export/en-hi-v1-ct2-int8
  allow_cpu_fallback: true
  max_new_tokens: 96
  num_beams: 2

# mode: reason only. Model knobs live in reason/configs/profiles.yaml.
# Jarvis-style assistant: Gemma picks reply language; Piper voices below.
reason:
  profile: gemma-2-2b-it-4bit
  # Default / Hindi / English Piper. Tamil & others → Latin transliteration
  # spoken with the English voice (no Tamil Piper voice in-repo).
  voice: tts/models/export/en_lessac_medium/voice.onnx
  voices:
    en: tts/models/export/en_lessac_medium/voice.onnx
    hi: tts/models/export/hi_official_v1/voice.onnx
  # OFF by default: open speakers + Boya USB cause a barge-in death spiral
  # (assistant hears itself → "you" → new reply forever). Use headphones
  # and set true only after noise is under control — see doc §19.
  barge_in: false
  mute_capture_while_replying: true

tts:
  voice: tts/models/export/hi_official_v1/voice.onnx
  sample_rate: 22050

playback:
  device: null
  keep_wavs: false

runtime:
  spill_dir: pipeline/spill
  log_latency: true
  log_level: INFO
