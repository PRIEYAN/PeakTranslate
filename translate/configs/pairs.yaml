# Translation pair registry
# POLICY: GPU primary; CPU fallback allowed for Marian only.

default_pair: en-hi

pairs:
  en-hi:
    src: en
    tgt: hi
    upstream: Helsinki-NLP/opus-mt-en-hi
    artifact: models/export/en-hi-v1-fp16
    finetuned: models/finetuned/en-hi-v1
    runtime: marian_pytorch
    device: cuda
    allow_cpu_fallback: true
    fallback:
      runtime: marian_ct2
      device: cpu
      artifact: models/export/en-hi-v1-ct2-int8
    decode:
      beam_size: 2
      max_new_tokens: 128

  en-ta:
    src: en
    tgt: ta
    upstream: Helsinki-NLP/opus-mt-en-mul
    artifact: models/export/en-ta-v1-fp16
    runtime: marian_pytorch
    device: cuda
    allow_cpu_fallback: true
    fallback:
      runtime: marian_ct2
      device: cpu
      artifact: models/export/en-ta-v1-ct2-int8
    decode:
      beam_size: 2
      max_new_tokens: 128
