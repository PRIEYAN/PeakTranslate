# TTS voice registry — PC pipeline uses Hindi as MT target by default.

default_voice: hi_official_v1

lang_to_voice:
  hi: hi_official_v1
  en: en_lessac_medium

voices:
  hi_official_v1:
    lang: hi
    locale: hi_IN
    quality: medium
    artifact: models/export/hi_official_v1
    runtime: piper_cpu
    sample_rate: 22050

  en_lessac_medium:
    lang: en
    locale: en_US
    quality: medium
    artifact: models/export/en_lessac_medium
    runtime: piper_cpu
    sample_rate: 22050
